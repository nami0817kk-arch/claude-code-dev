<table class="ranking">
  <thead>
    <tr>
      <th>順位</th>
      <th>銘柄名</th>
      <th>コード</th>
      <th>終値</th>
      <th>値上がり率</th>
      <th>出来高</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td>{{ row.rank }}</td>
      <td>{{ row.name }}</td>
      <td>{{ row.code }}</td>
      <td>{{ "{:,.0f}".format(row.close) if row.close is not none else "-" }}</td>
      <td class="gain">+{{ "%.2f"|format(row.gain_pct) }}%</td>
      <td>{{ "{:,}".format(row.volume) if row.volume is not none else "-" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
