# 楽天市場の価格を毎日記録する。
#
# このリポジトリに記録を貯めること自体が資産になる（APIは当日の価格しか返さないため、
# 履歴は自分で持つしかない）。したがってデータは成果物ではなくリポジトリに commit する。
#
# 実行時に生成AIは使わない。判定はすべて計算式で行うため、
# 定額のサブスク以外に従量課金は発生しない。
name: 価格を記録する

on:
  schedule:
    # 06:00 JST（= 21:00 UTC）。値動きが一段落した早朝に取る。
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect=価格を記録 / explore=対象ジャンルを調べる"
        type: choice
        options: [collect, explore]
        default: collect
      explore_genre:
        description: "explore のときに調べる親ジャンルID（0 が最上位）"
        type: string
        default: "0"

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 記録を壊す変更が入っていないかを先に確かめる。
      # 履歴は取り直しがきかないので、テストが落ちたら取得しない。
      - name: Test
        working-directory: projects/PJT006-price-tracker
        run: python -m unittest discover -s tests

      - name: Explore genres
        if: inputs.mode == 'explore'
        working-directory: projects/PJT006-price-tracker
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: python explore.py --genre "${{ inputs.explore_genre }}"

      - name: Collect prices
        if: inputs.mode != 'explore'
        working-directory: projects/PJT006-price-tracker
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python fetch.py

      - name: Commit the day's record
        id: commit
        if: inputs.mode != 'explore'
        run: |
          git config user.name "price-tracker"
          git config user.email "price-tracker@users.noreply.github.com"
          git add projects/PJT006-price-tracker/data
          if git diff --cached --quiet; then
            echo "変化なし。commit しない。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "価格を記録する（$(date -u -d '+9 hours' +%Y-%m-%d)）"
            # 別の実行が先に押している可能性があるので、取り込んでから押す
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 記録が増えたらサイトを作り直す。
  # Pages のデプロイはリポジトリに1つしか置けないため、
  # ここでは公開用ワークフローを呼び出す形にして、入口を1本に保つ。
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
