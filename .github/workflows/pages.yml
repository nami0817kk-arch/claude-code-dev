# サイト全体を GitHub Pages に公開する。
#
# GitHub Pages はリポジトリにつき1つしかデプロイできないため、
# 公開するものはこのワークフロー1本にまとめる。
# 別々のワークフローに分けると、後に走ったほうが前のサイトを丸ごと置き換えてしまう。
#
#   /soccer-manager/  サッカーゲーム（Flutter Web）
#   /tools/           生産管理の計算ツール（静的サイト）
#
# どちらか一方の変更で起動した場合でも、成果物は毎回すべて作り直す。
# 片方だけをアップロードすると、もう片方がサイトから消えるため。
name: サイトを公開する

on:
  push:
    branches:
      - master
      - main
    paths:
      - "projects/PJT003-soccer-manager/**"
      - "projects/PJT005-tool-factory/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── サッカーゲーム（Flutter Web） ──────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: projects/PJT003-soccer-manager
        run: flutter pub get

      - name: Run tests
        working-directory: projects/PJT003-soccer-manager
        run: flutter test

      - name: Build web
        working-directory: projects/PJT003-soccer-manager
        run: flutter build web --release --base-href "/claude-code-dev/soccer-manager/"

      # ── 計算ツール（静的サイト） ────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 収益導線の無いツールや壊れた定義があれば、ここで止まる
      - name: Test tools
        working-directory: projects/PJT005-tool-factory
        run: python -m unittest discover -s tests

      - name: Build tools
        working-directory: projects/PJT005-tool-factory
        run: python build.py

      # ── まとめてアップロードする ──────────────────────
      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/soccer-manager/legal dist/tools
          cp -r projects/PJT003-soccer-manager/build/web/* dist/soccer-manager/
          cp projects/PJT003-soccer-manager/legal/*.html dist/soccer-manager/legal/
          cp -r projects/PJT005-tool-factory/dist/* dist/tools/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
