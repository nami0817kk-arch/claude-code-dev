name: Deploy Soccer Manager (GitHub Pages)

on:
  push:
    branches:
      - master
      - main
    paths:
      - "PJT003-soccer-manager/**"
      - ".github/workflows/soccer-manager-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: PJT003-soccer-manager
        run: flutter pub get

      - name: Run tests
        working-directory: PJT003-soccer-manager
        run: flutter test

      - name: Build web
        working-directory: PJT003-soccer-manager
        run: flutter build web --release --base-href "/claude-code-dev/soccer-manager/"

      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/soccer-manager/legal
          cp -r PJT003-soccer-manager/build/web/* dist/soccer-manager/
          cp PJT003-soccer-manager/legal/*.html dist/soccer-manager/legal/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
